<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>希堤微旅 AI 智慧櫃台</title>
  <style>
    body { font-family: Arial, "Microsoft JhengHei", sans-serif; background: #f5f5f5; margin: 0; padding: 20px; text-align: center; }
    .card { max-width: 520px; margin: 50px auto; background: white; padding: 35px 25px; border-radius: 20px; box-shadow: 0 6px 25px rgba(0,0,0,.1); }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 30px; }
    form { display: flex; gap: 10px; margin-top: 24px; }
    #question { min-width: 0; flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
    button { border: 0; border-radius: 10px; padding: 0 22px; background: #222; color: white; font-size: 16px; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    .voice-panel { display: flex; align-items: center; gap: 9px; margin-top: 14px; padding: 10px; border: 1px solid #e4e4e4; border-radius: 12px; background: #fafafa; }
    .voice-panel button { min-height: 42px; padding: 0 14px; }
    .voice-panel select { min-width: 0; flex: 1; padding: 9px; border: 1px solid #ccc; border-radius: 8px; background: white; }
    #voiceStatus { font-size: 13px; color: #666; white-space: nowrap; }
    #stopVoice { background: #666; }
    #answer { margin-top: 25px; min-height: 1.7em; text-align: left; line-height: 1.7; background: #fafafa; padding: 18px; border-radius: 12px; white-space: pre-wrap; }
    .notice { margin-top: 30px; font-size: 13px; color: #777; }
    .contact { margin-top: 34px; padding-top: 24px; border-top: 1px solid #ddd; text-align: left; }
    .contact h2 { text-align: center; }
    #contactForm { display: grid; grid-template-columns: 1fr 1fr; }
    #contactForm label { display: grid; gap: 6px; font-size: 14px; color: #444; }
    #contactForm .wide { grid-column: 1 / -1; }
    #contactForm input, #contactForm textarea { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    #contactForm textarea { min-height: 90px; resize: vertical; }
    #contactForm button { min-height: 44px; }
    #contactStatus { min-height: 1.5em; margin-top: 12px; text-align: center; }
    .voice-mode { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; color: white; background: radial-gradient(circle at 50% 35%, #264b68 0, #102634 42%, #081117 100%); }
    .voice-mode[hidden] { display: none; }
    .voice-mode__content { box-sizing: border-box; width: min(620px, 100%); min-height: min(760px, calc(100dvh - 40px)); display: flex; flex-direction: column; align-items: center; padding: 42px 24px 28px; }
    .voice-mode h2 { margin: 0; font-size: clamp(22px, 5vw, 31px); }
    .voice-mode__hint { margin: 9px 0 0; color: #b8c9d3; }
    .voice-orb { width: 184px; height: 184px; margin: auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b6fff5, #43c9d5 35%, #3569ca 72%); box-shadow: 0 0 0 18px rgba(89,216,224,.08), 0 0 70px rgba(72,205,220,.42); transition: transform .25s, filter .25s; }
    .voice-orb[data-state="connecting"] { animation: orb-pulse 1.5s infinite; filter: saturate(.6); }
    .voice-orb[data-state="listening"] { animation: orb-breathe 2.5s infinite; }
    .voice-orb[data-state="user_speaking"] { animation: orb-speak .55s infinite alternate; filter: hue-rotate(30deg); }
    .voice-orb[data-state="answering"] { animation: orb-pulse .8s infinite; filter: hue-rotate(85deg); }
    .voice-orb[data-state="speaking"] { animation: orb-speak .45s infinite alternate; filter: hue-rotate(135deg); }
    .voice-orb[data-state="muted"] { filter: grayscale(.9); opacity: .65; }
    @keyframes orb-pulse { 50% { transform: scale(.93); opacity: .75; } }
    @keyframes orb-breathe { 50% { transform: scale(1.06); } }
    @keyframes orb-speak { to { transform: scale(1.1) rotate(2deg); border-radius: 43% 57% 52% 48%; } }
    .voice-mode__status { min-height: 32px; margin: 0 0 20px; font-size: 20px; }
    .voice-mode__error { min-height: 42px; margin: 0 0 12px; color: #ffd1cd; font-size: 14px; }
    .voice-mode__controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .voice-mode button, .voice-mode select { min-height: 48px; border: 1px solid rgba(255,255,255,.2); border-radius: 24px; padding: 0 18px; color: white; background: rgba(255,255,255,.1); font: inherit; }
    .voice-mode select option { color: #111; }
    .voice-mode .end-call { background: #bf3c3c; }
    .voice-transcript { width: 100%; margin-top: 20px; text-align: left; }
    .voice-transcript summary { cursor: pointer; color: #b8c9d3; text-align: center; }
    .voice-transcript__body { max-height: 160px; overflow: auto; margin-top: 10px; padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,.2); }
    body.voice-mode-open { overflow: hidden; }
    @media (max-width: 520px) { #contactForm { grid-template-columns: 1fr; } #contactForm .wide { grid-column: auto; } .voice-panel { flex-wrap: wrap; } .voice-panel select { flex-basis: 55%; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>希堤微旅 AI 智慧櫃台</h1>
    <div class="subtitle">24 小時旅宿資訊小幫手</div>
    <div class="subtitle">支援：繁體中文 / English / 日本語 / 한국어</div>
    <p>您可以詢問：</p>
    <p>早餐・停車・入住退房・房型<br>智慧電視・備品・交通・周邊景點與餐廳</p>

    <form id="chatForm">
      <input id="question" name="message" type="text" placeholder="請輸入您的問題" autocomplete="off" required>
      <button id="submitButton" type="submit">送出</button>
    </form>
    <div class="voice-panel" aria-label="Voice Assistant V3 即時真人對話模式">
      <button id="microphone" type="button" title="進入即時語音對話">🎙️ 進入語音模式</button>
      <span>與 AI 櫃檯即時自然對話</span>
    </div>

    <div id="answer" role="status" aria-live="polite">您好！請問今天有什麼可以協助您的呢？</div>
    <div class="notice">AI 提供一般旅宿資訊。訂房修改、退款、設備故障或其他特殊需求，請聯絡真人櫃台協助。</div>

    <section class="contact" aria-labelledby="contactHeading">
      <h2 id="contactHeading">留言給飯店人員</h2>
      <form id="contactForm">
        <label>姓名（必填）<input name="name" maxlength="80" required></label>
        <label>電話（必填）<input name="phone" type="tel" maxlength="30" required></label>
        <label>Email（選填）<input name="email" type="email" maxlength="254"></label>
        <label>入住日期（選填）<input name="stayDate" type="date"></label>
        <label class="wide">需求摘要（自動帶入，可修改）<textarea name="summary" maxlength="1000"></textarea></label>
        <button class="wide" type="submit">轉交飯店人員</button>
      </form>
      <div id="contactStatus" role="status" aria-live="polite"></div>
    </section>
  </main>

  <section id="voiceMode" class="voice-mode" aria-label="即時語音模式" aria-hidden="true" hidden>
    <div class="voice-mode__content">
      <h2>希堤微旅 AI 智慧櫃台</h2>
      <p class="voice-mode__hint">即時語音對話</p>
      <div class="voice-orb" data-voice-orb data-state="idle" aria-hidden="true"></div>
      <p class="voice-mode__status" data-voice-status role="status" aria-live="polite">語音待命</p>
      <p class="voice-mode__error" data-voice-error role="alert"></p>
      <div class="voice-mode__controls">
        <button type="button" data-voice-mute aria-pressed="false">🎙️ 麥克風</button>
        <select data-voice-selector aria-label="選擇 AI 語音"></select>
        <button type="button" class="end-call" data-voice-end>結束對話</button>
      </div>
      <details class="voice-transcript">
        <summary>查看對話紀錄</summary>
        <div class="voice-transcript__body" data-voice-transcript></div>
      </details>
    </div>
  </section>

  <script type="module">
    import { dateFromConversation, renderTextWithLinks, summaryFromConversation } from "./chat-ui.js";
    import { VoiceMode } from "./voice-mode.js";

    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const button = document.getElementById("submitButton");
    const answer = document.getElementById("answer");
    const MAX_HISTORY_MESSAGES = 20;
    const conversationHistory = [];
    const contactForm = document.getElementById("contactForm");
    const contactStatus = document.getElementById("contactStatus");
    const microphone = document.getElementById("microphone");
    const voiceMode = new VoiceMode({ root: document.getElementById("voiceMode"), home: document.querySelector("main") });
    microphone.addEventListener("click", () => voiceMode.open());

    async function sendMessage(rawMessage, fromVoice = false) {
      const message = rawMessage.trim();
      if (!message) return;

      button.disabled = true;
      answer.textContent = "AI 正在思考中，請稍候…";


      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: conversationHistory })
        });
        const rawBody = await response.text();
        let body;
        try {
          body = rawBody ? JSON.parse(rawBody) : {};
        } catch {
          throw new Error(`伺服器回應格式錯誤（HTTP ${response.status}）`);
        }

        if (!response.ok) {
          const status = body?.diagnostic?.status || response.status;
          const code = body?.diagnostic?.code ? `，代碼 ${body.diagnostic.code}` : "";
          throw new Error(`${body?.error || "請求失敗"}（HTTP ${status}${code}）`);
        }
        if (typeof body.answer !== "string" || !body.answer.trim()) {
          throw new Error("AI 未回傳文字答案");
        }
        const assistantAnswer = body.answer.trim();
        renderTextWithLinks(answer, assistantAnswer);
        conversationHistory.push(
          { role: "user", content: message },
          { role: "assistant", content: assistantAnswer }
        );
        if (conversationHistory.length > MAX_HISTORY_MESSAGES) {
          conversationHistory.splice(0, conversationHistory.length - MAX_HISTORY_MESSAGES);
        }
        const stayDateInput = contactForm.elements.namedItem("stayDate");
        if (!stayDateInput.value) stayDateInput.value = dateFromConversation(conversationHistory);
        contactForm.elements.namedItem("summary").value = summaryFromConversation(conversationHistory);
        input.value = "";
      } catch (error) {
        answer.textContent = `目前無法取得回答：${error.message || "未知錯誤"}`;
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    contactForm.addEventListener("submit", async event => {
      event.preventDefault();
      const contactButton = contactForm.querySelector("button");
      contactButton.disabled = true;
      contactStatus.textContent = "留言傳送中，請稍候…";
      try {
        const payload = Object.fromEntries(new FormData(contactForm));
        payload.conversationHistory = conversationHistory;
        const response = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || body.message !== "已將留言轉交飯店人員") {
          throw new Error(body.error || "目前留言未成功送出，請直接聯絡櫃台");
        }
        contactStatus.textContent = body.message;
        contactForm.reset();
      } catch (error) {
        contactStatus.textContent = error.message || "目前留言未成功送出，請直接聯絡櫃台";
      } finally {
        contactButton.disabled = false;
      }
    });
  </script>
</body>
</html>
